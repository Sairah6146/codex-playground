[build]
  command = "npm install && npm --prefix client install && npm run client:build"
  publish = "client/dist"
  functions = "netlify/functions"

[functions]
  # schema.sql is read via fs.readFileSync (not require()), so static
  # analysis won't pick it up on its own — list it explicitly.
  included_files = ["server/db/schema.sql"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
